<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Page not found on Durgesh Patel's portfolio." />

    <title>404 | Durgesh Patel</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap"
        rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #000;
            color: #fff;
            font-family: "Rajdhani", sans-serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        .error-code {
            margin: 0;
            font-family: "Orbitron", sans-serif;
            font-size: clamp(6rem, 20vw, 11rem);
            line-height: 1;
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 10px rgba(34, 211, 238, 0.8),
                0 0 30px rgba(168, 85, 247, 0.6);
        }

        h2 {
            margin: 24px 0 10px;
            font-family: "Orbitron", sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: #22d3ee;
        }

        p {
            margin: 0;
            color: #9ca3af;
            font-size: 1.05rem;
        }

        a {
            display: inline-block;
            margin-top: 28px;
            padding: 10px 24px;
            border: 1px solid #22d3ee;
            border-radius: 999px;
            color: #22d3ee;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #070606;
            background: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="error-code">404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you're looking for doesn't exist or may have been moved.
        </p>

        <a href="/">← Back to Home</a>
    </main>
</body>

</html>
